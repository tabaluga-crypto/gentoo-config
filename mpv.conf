# Always allow seeking, e.g. allow seeking within a local cache of HTTP stream
force-seekable=yes

# Always open a video window even with no video
force-window=yes

# Don't exit when the end of playlist is reached
keep-open=yes

# Always save the current playback position on exit
# save-position-on-quit=yes
resume-playback=no

# Modern high-performance video rendering pipeline
vo=gpu-next
gpu-api=vulkan

# Enable hardware-accelerated video decoding via NVDEC
hwdec=nvdec

# Maximize video frame rate up to 1440p resolution ceiling
ytdl-format="bestvideo[height<=1440]+bestaudio/best"

# High-performance cache allocation for network streams
cache=yes
demuxer-max-bytes=256MiB
demuxer-max-back-bytes=128MiB

# Subtitle configuration
sub-font=Inconsolata
sub-codepage=cp1250

