# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-O2 -march=arrowlake -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"


CPU_FLAGS_X86="aes avx avx2 avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 ssse3 vpclmulqdq"


ACCEPT_KEYWORDS="amd64"
MAKEOPTS="-j25"
EMERGE_DEFAULT_OPTS="--ask --verbose"
GRUB_PLATFORMS="efi-64"
FEATURES="ccache"
VIDEO_CARDS="nvidia"
ACCEPT_LICENSE="*"

# Updated USE flags for NVIDIA + Wayland
# Base display server configuration
USE="wayland xwayland X"

# Display acceleration, APIs, and rendering
USE="${USE} egl gles2 opengl vulkan"

# Audio, video, and multimedia pipeline
USE="${USE} alsa ffmpeg nvenc pipewire pipewire-pulse pulseaudio pulse-plugin sound-server"

# Audio/video streaming and screen sharing
USE="${USE} screencast"

# Init system, seat management, and system daemons
USE="${USE} dbus elogind openrc policykit seatd udev"

# Hardware support and kernel integration
USE="${USE} dist-kernel grub libinput lm-sensors nscd nvidia nvme modules"

# Filesystems, encryption, and system storage tools
USE="${USE} cryptsetup mdadm xfs"

# System libraries, UI toolkits and text formatting
USE="${USE} ncurses unicode glib introspection cups widgets gui gtk wayland"

# Disabled system features and subsystems (Override block)
USE="${USE} -bluetooth -lvm -modemmanager -ppp -systemd -xorg -xv"

# NOTE: This stage was built with the bindist USE flag enabled

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs
LC_MESSAGES=C.UTF-8

GENTOO_MIRRORS="ftp://mirror.mephi.ru/gentoo-distfiles/ http://distfiles.gentoo.org"

